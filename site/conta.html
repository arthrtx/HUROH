      <script>
        // login com o Google na app de computador: a sessão segue para a app (só para o próprio PC)
        const app = new URLSearchParams(location.search).get('app');
        const paraApp = Boolean(app && /^http:\/\/127\.0\.0\.1:\d{2,5}\/google\/[0-9a-f]{32}$/.test(app));

        if (paraApp) {
            location.replace(app + location.hash);
        } else {
            history.replaceState(null, '', location.pathname);
            document.getElementById('conta-titulo').textContent = 'Nada para fazer aqui';
            document.getElementById('conta-texto').textContent = 'Esta página só serve para entrar na HUROH com o Google. Volta à aplicação.';
        }
      </script>
