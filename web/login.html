<html lang="pt">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HUROH · Entrar</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/formularios.css" />
    <link rel="stylesheet" href="css/paginas.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="marca-h" viewBox="46 48 148 148" fill="currentColor"><g transform="translate(120 120) skewX(-12) translate(-120 -120)"><path d="M64 75 A19 19 0 0 1 102 75 L102 165 A19 19 0 0 1 64 165 Z M138 75 A19 19 0 0 1 176 75 L176 115 A19 19 0 0 1 157 134 C142 134 134 124 120 124 C109 124 102 131 102 142 L84 142 L84 92 L102 92 C102 105 110 112 120 112 C130 112 138 106 138 94 Z"/><circle cx="157" cy="171" r="18"/></g></symbol>
      <symbol id="marca-nome" viewBox="34 40 734 160" fill="currentColor"><g fill="currentColor" transform="translate(0 120) skewX(-12) translate(0 -120)"><g transform="translate(0 0)"><path d="M64 75 A19 19 0 0 1 102 75 L102 165 A19 19 0 0 1 64 165 Z M138 75 A19 19 0 0 1 176 75 L176 115 A19 19 0 0 1 157 134 C142 134 134 124 120 124 C109 124 102 131 102 142 L84 142 L84 92 L102 92 C102 105 110 112 120 112 C130 112 138 106 138 94 Z"/><circle cx="157" cy="171" r="18"/></g><g fill="none" stroke="currentColor" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
<path d="M217 75 V128 A37 37 0 0 0 291 128 V75"/>
<path d="M351 165 V75 H388 A30 30 0 0 1 388 135 H372 L414 165"/>
<rect x="484" y="75" width="98" height="90" rx="45"/>
</g><g transform="translate(559 0)"><path d="M64 75 A19 19 0 0 1 102 75 L102 165 A19 19 0 0 1 64 165 Z M138 75 A19 19 0 0 1 176 75 L176 115 A19 19 0 0 1 157 134 C142 134 134 124 120 124 C109 124 102 131 102 142 L84 142 L84 92 L102 92 C102 105 110 112 120 112 C130 112 138 106 138 94 Z"/><circle cx="157" cy="171" r="18"/></g></g></symbol>
    </svg>
    <div class="barra-janela" aria-hidden="true"></div>
    <div class="botoes-janela">
      <button type="button" data-janela="minimizar" aria-label="Minimizar" title="Minimizar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8"/></svg></button>
      <button type="button" data-janela="fechar" class="fechar" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
    <main class="entrada">
      <div class="entrada-cartao vidro">
        <div class="logo"><span class="logo-marca"><svg class="marca-h" aria-hidden="true"><use href="#marca-h"/></svg></span><svg class="logo-nome-entrada" viewBox="0 0 734 160" role="img" aria-label="HUROH"><use href="#marca-nome"/></svg></div>
        <p class="entrada-slogan">Your life. In sync.</p>

        <div class="separadores" id="separadores">
          <button type="button" class="separador ativo" data-modo="entrar">Entrar</button>
          <button type="button" class="separador" data-modo="registar">Criar conta</button>
        </div>

        <form class="formulario" id="form-entrar" data-modo="entrar">
          <label class="campo">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label class="campo">
            <span>Palavra-passe</span>
            <input type="password" name="senha" autocomplete="current-password" required />
          </label>
          <button type="submit" class="botao botao-principal">Entrar</button>
          <button type="button" class="botao-link" id="link-recuperar">Esqueci-me da palavra-passe</button>
        </form>

        <form class="formulario escondido" id="form-registar" data-modo="registar">
          <label class="campo">
            <span>Nome</span>
            <input type="text" name="nome" maxlength="60" autocomplete="given-name" required />
          </label>
          <label class="campo">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label class="campo">
            <span>Palavra-passe</span>
            <input type="password" name="senha" minlength="8" autocomplete="new-password" required />
            <small>Mínimo de 8 caracteres.</small>
          </label>
          <label class="termos-aceitar">
            <input type="checkbox" name="termos" required />
            <span>Li e aceito os <button type="button" class="botao-link" data-ver-termos>Termos de Utilização</button></span>
          </label>
          <button type="submit" class="botao botao-principal">Criar conta</button>
        </form>

        <form class="formulario escondido" id="form-recuperar" data-modo="recuperar">
          <p class="texto-suave">Enviamos um email com um link para definires uma nova palavra-passe.</p>
          <label class="campo">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <button type="submit" class="botao botao-principal">Enviar link</button>
          <button type="button" class="botao-link" id="link-voltar">Voltar</button>
        </form>

        <form class="formulario escondido" id="form-nova-senha" data-modo="nova-senha">
          <p class="texto-suave">Escolhe a tua nova palavra-passe.</p>
          <label class="campo">
            <span>Nova palavra-passe</span>
            <input type="password" name="senha" minlength="8" autocomplete="new-password" required />
          </label>
          <button type="submit" class="botao botao-principal">Guardar</button>
        </form>

        <p class="mensagem" id="mensagem" role="status"></p>
        <div class="led" aria-hidden="true"></div>
      </div>
    </main>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
