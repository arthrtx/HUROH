<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://mkcqjgvradohwlkunepi.supabase.co; connect-src 'self' data: https://mkcqjgvradohwlkunepi.supabase.co wss://mkcqjgvradohwlkunepi.supabase.co" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUROH · Menu lateral</title>
    <link rel="stylesheet" href="css/lateral.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="marca-h" viewBox="46 48 148 148" fill="currentColor"><g transform="translate(120 120) skewX(-12) translate(-120 -120)"><path d="M64 75 A19 19 0 0 1 102 75 L102 165 A19 19 0 0 1 64 165 Z M138 75 A19 19 0 0 1 176 75 L176 115 A19 19 0 0 1 157 134 C142 134 134 124 120 124 C109 124 102 131 102 142 L84 142 L84 92 L102 92 C102 105 110 112 120 112 C130 112 138 106 138 94 Z"/><circle cx="157" cy="171" r="18"/></g></symbol>
      <symbol id="marca-nome" viewBox="34 40 734 160" fill="currentColor"><g fill="currentColor" transform="translate(0 120) skewX(-12) translate(0 -120)"><g transform="translate(0 0)"><path d="M64 75 A19 19 0 0 1 102 75 L102 165 A19 19 0 0 1 64 165 Z M138 75 A19 19 0 0 1 176 75 L176 115 A19 19 0 0 1 157 134 C142 134 134 124 120 124 C109 124 102 131 102 142 L84 142 L84 92 L102 92 C102 105 110 112 120 112 C130 112 138 106 138 94 Z"/><circle cx="157" cy="171" r="18"/></g><g fill="none" stroke="currentColor" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
<path d="M217 75 V128 A37 37 0 0 0 291 128 V75"/>
<path d="M351 165 V75 H388 A30 30 0 0 1 388 135 H372 L414 165"/>
<rect x="484" y="75" width="98" height="90" rx="45"/>
</g><g transform="translate(559 0)"><path d="M64 75 A19 19 0 0 1 102 75 L102 165 A19 19 0 0 1 64 165 Z M138 75 A19 19 0 0 1 176 75 L176 115 A19 19 0 0 1 157 134 C142 134 134 124 120 124 C109 124 102 131 102 142 L84 142 L84 92 L102 92 C102 105 110 112 120 112 C130 112 138 106 138 94 Z"/><circle cx="157" cy="171" r="18"/></g></g></symbol>
    </svg>
    <div class="gatilho" id="gatilho" aria-hidden="true"></div>

    <div class="dock" id="dock">
      <nav class="trilho zona" aria-label="Menu rápido">
        <span class="trilho-logo"><svg class="marca-h" aria-hidden="true"><use href="#marca-h"/></svg></span>
        <i class="divisor"></i>
          <button type="button" class="trilho-item" data-pagina="dashboard" title="Dashboard"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
          <button type="button" class="trilho-item" data-widgets title="Widgets"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button>
          <button type="button" class="trilho-item" data-pagina="definicoes" title="Definições"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></button>
        <i class="divisor"></i>
          <button type="button" class="trilho-item sair-item" data-esconder title="Sair do menu lateral"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg></button>
        <i class="divisor"></i>
        <img class="trilho-avatar" id="avatar-trilho" alt="" />
      </nav>

      <aside class="painel zona" aria-label="HUROH">
        <header class="painel-topo">
          <div>
            <svg class="painel-nome" viewBox="0 0 734 160" role="img" aria-label="HUROH"><use href="#marca-nome"/></svg>
            <small id="painel-data"></small>
          </div>
          <div class="painel-topo-direita">
            <span class="painel-hora" id="painel-hora">--:--</span>
            <button type="button" class="botao-fechar" data-esconder title="Fechar menu lateral" aria-label="Fechar menu lateral"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          </div>
        </header>

        <p class="rotulo">Menu</p>
        <div class="painel-lista">
            <button type="button" class="painel-item" data-pagina="dashboard">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span>
            </button>
            <button type="button" class="painel-item" data-pagina="financas">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M7 15h3"/></svg><span>Finanças</span>
            </button>
            <button type="button" class="painel-item" data-pagina="agenda">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Agenda</span>
            </button>
            <button type="button" class="painel-item" data-pagina="tarefas">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="m3.5 6.5 1.2 1.2L7 5.4M3.5 12l1.2 1.2L7 10.9M3.5 17.5l1.2 1.2L7 16.4"/></svg><span>Tarefas</span>
            </button>
        </div>

        <i class="divisor-largo"></i>

        <p class="rotulo">Registo rápido</p>
        <div class="rapidos">
          <button type="button" class="rapido" data-acao="despesa"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1.2 12.2a1 1 0 0 1-1 .8H7.7a1 1 0 0 1-1-.8z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg><span>Despesa</span></button>
          <button type="button" class="rapido" data-acao="rendimento"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><path d="M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6"/></svg><span>Rendimento</span></button>
          <button type="button" class="rapido" data-acao="tarefa" data-destino="tarefas"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="m3.5 6.5 1.2 1.2L7 5.4M3.5 12l1.2 1.2L7 10.9M3.5 17.5l1.2 1.2L7 16.4"/></svg><span>Tarefa</span></button>
          <button type="button" class="rapido" data-acao="evento" data-destino="agenda"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Evento</span></button>
        </div>

        <i class="divisor-largo"></i>

        <div class="pilulas">
          <button type="button" class="cartao-saldo" data-pagina="financas">
            <div class="pilula-cabeca">
              <span class="pilula-icone verde"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M7 15h3"/></svg></span>
              <div>
                <small>SALDO</small>
                <strong>A tua conta</strong>
              </div>
              <span class="pilula-canto" id="saldo-mes"></span>
            </div>
            <p class="saldo-valor" id="saldo-valor">—</p>
            <svg class="linha-saldo" id="linha-saldo" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true"></svg>
          </button>

          <button type="button" class="pilula" data-pagina="tarefas">
            <span class="pilula-icone"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="m3.5 6.5 1.2 1.2L7 5.4M3.5 12l1.2 1.2L7 10.9M3.5 17.5l1.2 1.2L7 16.4"/></svg></span>
            <div class="pilula-texto">
              <small>TAREFAS</small>
              <strong id="tarefa-proxima">—</strong>
            </div>
            <span class="mini-anel" id="tarefas-anel"><b id="tarefas-pct">0%</b></span>
          </button>

          <button type="button" class="pilula" data-pagina="agenda">
            <span class="pilula-icone azul"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></span>
            <div class="pilula-texto">
              <small id="evento-quando">AGENDA</small>
              <strong id="evento-titulo">Sem eventos</strong>
            </div>
            <span class="pilula-canto" id="evento-hora"></span>
          </button>

          <button type="button" class="pilula" data-pagina="dashboard" id="pilula-alertas">
            <span class="pilula-icone vermelho"><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg><i class="ponto escondido" id="alertas-ponto"></i></span>
            <div class="pilula-texto">
              <small>LEMBRETES</small>
              <strong id="alertas-texto">Tudo em dia</strong>
            </div>
          </button>
        </div>

        <i class="divisor-largo"></i>

        <button type="button" class="perfil" data-pagina="definicoes">
          <img class="perfil-foto" id="avatar-painel" alt="" />
          <div>
            <strong id="perfil-nome">HUROH</strong>
            <small id="perfil-email">Entra para veres os teus dados</small>
          </div>
        </button>
      </aside>
    </div>

    <script type="module" src="js/lateral.js"></script>
  </body>
</html>
